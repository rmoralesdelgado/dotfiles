# ~/.tmux.conf

# ============================================================================
# CORE SETTINGS
# ============================================================================

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support (useful for resizing panes)
set -g mouse on

# Start window/pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 10000

# ============================================================================
# KEYBINDINGS
# ============================================================================

# Change prefix from Ctrl+b to Ctrl+a (easier to reach, less conflict with Windsurf)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with more intuitive keys
# | for vertical split, - for horizontal split
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Prefix + vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + Shift+arrow
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ============================================================================
# DRACULA THEME via TPM
# ============================================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

# Dracula theme customization
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "time"
set -g @dracula-military-time true

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'